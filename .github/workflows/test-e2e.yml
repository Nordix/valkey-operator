name: E2E Tests

on:
  push:
  pull_request:

jobs:
  prepare:
    name: Prepare e2e matrix
    runs-on: ubuntu-latest
    outputs:
      buckets: ${{ steps.set.outputs.buckets }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .go-version
          cache: false  # explicit actions/cache below owns the Go caches

      # Explicit Go build+module cache. setup-go's built-in cache saves only
      # once per go.mod hash and never refreshes it (see cache-save.ts:
      # "not saving cache" on key hit), so it can't keep a warm build cache and
      # every run cold-compiles. This saves on every run (github.sha in the key)
      # and restores the latest via restore-keys. Content-addressed, so it can
      # never serve stale code.
      - name: Cache Go build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-
            go-build-${{ runner.os }}-

      # A test can match two buckets via its own or inherited Describe/Context
      # labels, which would run it twice across the matrix. Fail fast if so,
      # naming the file:line (coverage itself is guaranteed by the catch-all).
      - name: Verify no test is in two buckets
        run: make test-e2e-verify-buckets

      # Emit the matrix from the same buckets the verify step just checked.
      - name: Build matrix
        id: set
        run: echo "buckets=$(make -s test-e2e-matrix)" >> "$GITHUB_OUTPUT"

  test-e2e:
    name: e2e (${{ matrix.bucket }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bucket: ${{ fromJSON(needs.prepare.outputs.buckets) }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .go-version
          cache: false  # explicit actions/cache below owns the Go caches

      # See the prepare job for why an explicit cache is needed (setup-go's
      # built-in cache saves once per go.mod and never refreshes).
      - name: Cache Go build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-
            go-build-${{ runner.os }}-

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Running Test e2e
        run: make test-e2e TEST_LABELS="${{ matrix.bucket }}"
