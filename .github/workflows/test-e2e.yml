name: E2E Tests

on:
  push:
  pull_request:

# Single source of truth for the operator image tag: built once in prepare,
# loaded (not rebuilt) in each matrix job. The test suite reads the same value
# via E2E_MANAGER_IMAGE, so this cannot drift from managerImage in the tests.
env:
  MANAGER_IMAGE: valkey/valkey-operator:v0.0.1

jobs:
  prepare:
    name: Prepare e2e matrix
    runs-on: ubuntu-latest
    outputs:
      buckets: ${{ steps.set.outputs.buckets }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .go-version
          cache: false  # explicit actions/cache below owns the Go caches

      # Explicit Go build+module cache. setup-go's built-in cache saves only
      # once per go.mod hash and never refreshes it (see cache-save.ts:
      # "not saving cache" on key hit), so it can't keep a warm build cache and
      # every run cold-compiles. This saves on every run (github.sha in the key)
      # and restores the latest via restore-keys. Content-addressed, so it can
      # never serve stale code.
      - name: Cache Go build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ runner.os }}-${{ hashFiles('.go-version', '**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('.go-version', '**/go.sum') }}-
            go-build-${{ runner.os }}-

      # A test can match two buckets via its own or inherited Describe/Context
      # labels, which would run it twice across the matrix. Fail fast if so,
      # naming the file:line (coverage itself is guaranteed by the catch-all).
      - name: Verify no test is in two buckets
        run: make test-e2e-verify-buckets

      # Emit the matrix from the same buckets the verify step just checked.
      - name: Build matrix
        id: set
        run: echo "buckets=$(make -s test-e2e-matrix)" >> "$GITHUB_OUTPUT"

      # Build the operator image ONCE here and share it with every matrix job
      # via an artifact. Each e2e job loads it and skips its own docker-build
      # (E2E_SKIP_IMAGE_BUILD=true), removing a redundant ~1.5min build per job.
      - name: Build operator image
        run: make docker-build IMG="$MANAGER_IMAGE"

      - name: Save operator image
        run: docker save "$MANAGER_IMAGE" -o /tmp/operator-image.tar

      - name: Upload operator image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: operator-image
          path: /tmp/operator-image.tar
          retention-days: 1

  test-e2e:
    name: e2e (filter=${{ matrix.bucket }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bucket: ${{ fromJSON(needs.prepare.outputs.buckets) }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .go-version
          cache: false  # explicit actions/cache below owns the Go caches

      # See the prepare job for why an explicit cache is needed (setup-go's
      # built-in cache saves once per go.mod and never refreshes).
      - name: Cache Go build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ runner.os }}-${{ hashFiles('.go-version', '**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('.go-version', '**/go.sum') }}-
            go-build-${{ runner.os }}-

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      # Load the image built once in the prepare job, so BeforeSuite can skip
      # its own docker-build (E2E_SKIP_IMAGE_BUILD below).
      - name: Download operator image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: operator-image
          path: /tmp

      - name: Load operator image
        run: docker load -i /tmp/operator-image.tar

      - name: Running Test e2e
        env:
          E2E_SKIP_IMAGE_BUILD: "true"
          E2E_MANAGER_IMAGE: ${{ env.MANAGER_IMAGE }}
        run: make test-e2e TEST_LABELS="${{ matrix.bucket }}"
