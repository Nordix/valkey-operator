name: Tests (orig baseline)

# Original test workflow (no Go build cache, with redundant `go mod tidy`), kept
# temporarily to compare timing against the cached version in test.yml.
# Remove once the comparison is done.

on:
  push:
  pull_request:

jobs:
  test:
    name: Run on Ubuntu (orig)
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .go-version

      - name: Running Tests
        run: |
          go mod tidy
          make test
