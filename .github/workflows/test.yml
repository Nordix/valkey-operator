name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .go-version
          cache: false  # explicit actions/cache below owns the Go caches

      # Explicit Go build+module cache. setup-go's built-in cache saves only
      # once per go.mod hash and never refreshes it, so it can't keep a warm
      # build cache. This saves every run (github.sha key) and restores the
      # latest via restore-keys. Content-addressed, so never serves stale code.
      - name: Cache Go build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ runner.os }}-${{ hashFiles('.go-version', '**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('.go-version', '**/go.sum') }}-
            go-build-${{ runner.os }}-

      # go mod tidy is intentionally omitted: tidiness is verified by the
      # dedicated mod-tidy job in lint.yml, and deps download on demand.
      - name: Running Tests
        run: make test
